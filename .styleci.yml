preset: laravel

# align_double_arrow was removed when Pint became the formatter for this repo.
# Pint's laravel preset sets binary_operator_spaces to single_space, so keeping
# it enabled here made StyleCI and Pint disagree on every aligned => in the
# codebase and fail the build on ~70 files.
disabled:
  - unused_use

finder:
  not-name:
    - index.php
    - server.php
